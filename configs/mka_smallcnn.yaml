seed: 1337

data:
  data_root: data/SpeechCommands
  sample_rate: 16000
  num_samples: 16000
  silence_ratio: 0.1
  silence_gain_min: 0.0
  silence_gain_max: 0.1

features:
  sample_rate: 16000
  n_fft: 400
  hop_length: 160
  win_length: 400
  n_mels: 40
  f_min: 20
  f_max: 7600
  feature_norm: none

model:
  name: small_cnn
  num_classes: 12
  dropout: 0.1

train:
  batch_size: 128
  num_workers: 0
  pin_memory: false
  learning_rate: 0.001
  weight_decay: 0.0001
  device: cpu
  use_cudnn_benchmark: false
  use_weighted_sampler: true
  use_class_weighted_loss: false
